<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pending Issues</title>
<link rel="icon" href="icon-192.png">
<style id="sty">
:root{--paper:#faf6ee;--head:#f3ecdf;--line:#e4dccb;--ink:#2a251f;--mu:#6f675a;--ac:#0f8a7e;--ac2:#0b6f66;--er:#b3261e;--wa:#8a5a00;--en:#2f6fde;--ot:#0f8a7e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper)}
body{font:13.5px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
#note{display:flex;flex-direction:column;height:100%;background:var(--paper);position:relative}
.hd{display:flex;align-items:center;gap:4px;padding:8px 10px 6px;background:var(--head);border-bottom:3px double var(--ink);flex:none}
.hd b{font:700 18px/1.2 Georgia,'Times New Roman',serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:transparent;border-radius:6px;min-width:30px;height:30px;padding:0 7px;font-size:14px;line-height:1;color:var(--mu)}
.ib:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.ib.on{color:#fff;background:var(--er)}
.sum{padding:5px 10px;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--ink);flex:none;background:var(--head)}
.sum .hi{color:var(--er);font-weight:700}
.list{flex:1;overflow:auto;padding:2px 0 10px}
.sec{font:700 14px/1.2 Georgia,serif;margin:10px 10px 2px;padding-top:5px;border-top:2px solid var(--ink);display:flex;gap:6px;align-items:baseline}
.sec small{font:600 11px "Segoe UI",sans-serif;color:var(--mu)}
.sec.energy{color:var(--en);border-top-color:var(--en)}.sec.other{color:var(--ot);border-top-color:var(--ot)}
.it{display:flex;gap:8px;align-items:flex-start;padding:7px 10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.it:hover{background:#f4eee2}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:#cfc4ad}
.it.high .dot{background:var(--er)}
.bd{flex:1;min-width:0}
.tx{font:600 14px/1.38 Georgia,'Times New Roman',serif;color:#241f1a;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.open .tx{display:block}
.ac{display:none;font-size:12.5px;color:#3d372e;margin-top:3px;word-break:break-word}
.it.open .ac{display:block}
.mt{font-size:11.5px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.open .mt{white-space:normal}
.cq{color:var(--wa);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:28px 12px}
.toast{position:absolute;left:8px;right:8px;bottom:8px;background:#2a251f;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div id="note">
  <div class="hd">
    <b>Pending Issues</b>
    <button class="ib" data-k="hi" title="Show high priority only">High</button>
    <button class="ib" data-k="ref" title="Refresh">⟳</button>
    <button class="ib" data-k="pin" title="Keep on top of other windows">📌</button>
  </div>
  <div class="sum" data-r="sum">Loading…</div>
  <div class="list" data-r="list"></div>
  <div class="toast" data-r="toast"></div>
</div>
<script>
(()=>{
/* Same source as the bulletin: the Pending Issues dashboard web-app link (ends in /exec) */
const SOURCE_URL='https://script.google.com/macros/s/AKfycbzLgIDohl8fJWG8Dz8xbzeY4-ivr2usUEJNEGbsOaqJxakjnGOYhLdIQjnIoJNxmmThtg/exec';

// All lookups go through R (the note), so it keeps working when moved into the floating window.
const R=document.getElementById('note'),$=s=>R.querySelector(s);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isHigh=it=>String(it.priority||'').toLowerCase()==='high';
const needs=it=>it.needs_clarification===true||it.needs_clarification==='true';
let DATA=null,fromCache=false,onlyHigh=ls.get('pid.stickyHigh','')==='1',openIds=new Set(),pip=null,tt;
const toast=m=>{const t=$('[data-r=toast]');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)};

async function load(say){
  try{const r=await fetch(SOURCE_URL+'?format=json',{cache:'no-store'});const j=await r.json();if(!j||!Array.isArray(j.groups))throw new Error('bad');
    DATA=j;fromCache=false;ls.set('pid.cache',JSON.stringify(j));render();if(say)toast('Updated');
  }catch(e){if(!DATA){const c=ls.get('pid.cache','');if(c){try{DATA=JSON.parse(c);fromCache=true}catch(x){}}render()}
    if(say||!DATA)toast('Could not reach the server.'+(DATA?' Showing saved copy.':''))}
}

function render(){const L=$('[data-r=list]'),S=$('[data-r=sum]');
  $('[data-k=hi]').classList.toggle('on',onlyHigh);
  if(!DATA){S.textContent='Not loaded';L.innerHTML='<div class="empty">Could not load the list.<br><small>Check the internet and press ⟳.</small></div>';return}
  const groups=(DATA.groups||[]).map(g=>({id:String(g.id||''),title:g.title||'',items:(g.items||[])}));
  const all=groups.flatMap(g=>g.items),hi=all.filter(isHigh).length;
  S.innerHTML=[`${all.length} pending`,hi?`<span class="hi">${hi} high</span>`:'',fromCache?'saved copy':(DATA.updated?'updated '+esc(DATA.updated):'')].filter(Boolean).join(' · ');
  const by=(a,b)=>(isHigh(b)-isHigh(a))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true});
  let h='';
  groups.forEach(g=>{const items=g.items.filter(it=>!onlyHigh||isHigh(it)).sort(by);if(!items.length)return;
    h+=`<div class="sec ${esc(g.id)}">${esc(g.title)}<small>${items.length}</small></div>`+items.map(it=>{const id=String(it.id||'');
      const meta=[it.category,g.id!=='energy'?it.department:''].filter(Boolean).map(esc).join(' · ')+(needs(it)?' · <span class="cq">Needs clarification</span>':'');
      return `<div class="it${isHigh(it)?' high':''}${openIds.has(id)?' open':''}" data-id="${esc(id)}"><span class="dot" title="${isHigh(it)?'High priority':''}"></span>
        <div class="bd"><div class="tx">${esc(it.title||it.action)}</div>${it.title&&it.action?`<div class="ac">${esc(it.action)}</div>`:''}<div class="mt">${meta}</div></div></div>`}).join('')});
  L.innerHTML=h||`<div class="empty">${onlyHigh?'No high-priority actions.':'All clear ✓<br><small>No pending actions.</small>'}</div>`;
  badgePin();
}

R.addEventListener('click',e=>{const b=e.target.closest('[data-k]');
  if(b){const k=b.dataset.k;
    if(k==='ref')load(true);
    if(k==='hi'){onlyHigh=!onlyHigh;ls.set('pid.stickyHigh',onlyHigh?'1':'0');render()}
    if(k==='pin'){pip?pip.close():pinOnTop()}
    return}
  const it=e.target.closest('.it');if(!it)return;const id=it.dataset.id;
  openIds.has(id)?openIds.delete(id):openIds.add(id);it.classList.toggle('open')});

// Keep on top: a small floating window above all other windows (Chrome / Edge)
function badgePin(){const b=$('[data-k=pin]');if(!b)return;b.style.background=pip?'rgba(15,138,126,.15)':'';b.title=pip?'Put back':'Keep on top of other windows';
  if(!('documentPictureInPicture' in window))b.style.display='none'}
async function pinOnTop(){try{
  pip=await documentPictureInPicture.requestWindow({width:Math.max(300,R.offsetWidth||340),height:Math.max(420,R.offsetHeight||520)});
  pip.document.head.appendChild(document.getElementById('sty').cloneNode(true));pip.document.title='Pending Issues';
  pip.document.body.appendChild(R);badgePin();
  const ph=document.createElement('div');ph.className='empty';ph.id='ph';ph.textContent='Showing in the floating window. Close it to bring the note back here.';document.body.appendChild(ph);
  pip.addEventListener('pagehide',()=>{document.body.appendChild(R);const p=document.getElementById('ph');if(p)p.remove();pip=null;badgePin()});
  pip.addEventListener('focus',()=>load());
 }catch(e){toast('Keep on top needs Chrome or Edge')}}

// start: saved copy first (instant), then the latest; refresh every 5 minutes and on focus
const c=ls.get('pid.cache','');if(c){try{DATA=JSON.parse(c);fromCache=true}catch(e){}}
render();load();
setInterval(()=>load(),300000);
window.addEventListener('focus',()=>load());
})();
</script>
</body>
</html>
