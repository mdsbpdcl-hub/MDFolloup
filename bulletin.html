<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-up Bulletin</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1f2933;--mu:#5d6876;--fa:#8b95a3;--ln:#e3e8ee;--fb:#d3dae3;--pg:#f7f9fb;--ac:#0f8a7e;--ac2:#0b6f66;--act:#e7f5f2;--acl:#cfe9e3;--er:#b3261e;--ert:#fdeeed;--wa:#8a5a00;--wat:#fff7e3;--ok:#1a7f45;--okt:#e9f7ef}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:14px/1.5 "Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
.serif{font-family:Georgia,"Times New Roman",serif}
.sheet{max-width:1280px;margin:18px auto;background:#fff;border:1px solid var(--ln);padding:22px 32px 30px}
/* masthead */
.mast{text-align:center;padding-bottom:8px;border-bottom:3px double var(--ink)}
.mast .sm{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mu)}
.mast h1{font:700 42px/1.1 Georgia,"Times New Roman",serif;margin:4px 0 0;letter-spacing:.5px}
.dateline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding:6px 0;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
/* strap of counts */
.strap{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink);margin-bottom:6px}
.strap a{display:block;text-align:center;padding:10px 6px;text-decoration:none;color:inherit;border-right:1px solid var(--ln)}
.strap a:last-child{border-right:0}
.strap a:hover{background:var(--pg)}
.strap b{display:block;font:700 30px/1.1 Georgia,serif}
.strap span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.strap .od b{color:var(--er)}.strap .td b{color:var(--wa)}.strap .dn b{color:var(--ok)}
/* toolbar */
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 4px}
.tool input,.tool select{min-height:36px;border:1px solid var(--fb);border-radius:8px;padding:6px 10px;background:#fff;outline:0}
.tool input:focus,.tool select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.tool input{width:220px}
.sp{flex:1}
.tb{min-height:36px;padding:6px 12px;border:1px solid var(--fb);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.tb:hover{border-color:var(--ac);color:var(--ac2)}
.sync{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--okt);color:var(--ok)}
.sync.wait{background:var(--wat);color:var(--wa)}.sync.off{background:#eef1f4;color:var(--mu)}
/* sections */
section{margin-top:18px}
h2{font:700 22px/1.2 Georgia,serif;margin:0 0 4px;padding-top:8px;border-top:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
h2 small{font:600 13px "Noto Sans","Segoe UI",sans-serif;color:var(--mu)}
h2.od{border-top-color:var(--er)}h2.od span{color:var(--er)}
.cols{columns:3 300px;column-gap:30px;column-rule:1px solid var(--ln)}
.story{break-inside:avoid;padding:10px 0 12px;border-bottom:1px solid var(--ln);transition:opacity .35s}
.kick{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);display:flex;flex-wrap:wrap;gap:8px}
.kick .late{color:var(--er)}.kick .tdy{color:var(--wa)}.kick .urg{color:#fff;background:var(--er);padding:0 6px;border-radius:3px}
.story h3{font:700 16.5px/1.35 Georgia,serif;margin:4px 0 3px;word-break:break-word;cursor:pointer}
.body{font-size:14px;color:#33404d;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.story{cursor:pointer}
.full{display:none;margin:4px 0 3px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.full b{font:700 16.5px/1.35 Georgia,serif}
.story.open .full{display:block}.story.open h3,.story.open .body,.story.open .more{display:none}
.more{font-size:12px;color:var(--ac2);font-weight:600;margin-top:2px}
.story .acts,.story .nb{cursor:default}
.meta{font-size:12px;color:var(--mu);margin-top:4px}
.rem{font-size:13px;margin-top:5px;padding:4px 8px;background:var(--pg);border-left:3px solid var(--fb);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ab{min-height:30px;padding:3px 10px;border:1px solid var(--fb);background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.ab:hover{border-color:var(--ac);color:var(--ac2)}
.ab.wa{display:inline-flex;align-items:center;text-decoration:none;color:#128c4a;border-color:#bfe5cd;background:#f1fbf5}
.ab.dsp{background:var(--ac);border-color:var(--ac);color:#fff}.ab.dsp:hover{background:var(--ac2);color:#fff}
.nb{display:flex;gap:6px;margin-top:8px}.nb input{flex:1;min-height:32px;border:1px solid var(--fb);border-radius:6px;padding:4px 8px;outline:0}
.nb input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.gone{opacity:.25}
.story.done h3,.story.done .body{text-decoration:line-through;color:var(--mu)}
.empty{color:var(--mu);font-style:italic;padding:8px 0}
.link{max-width:560px;margin:30px auto;text-align:center}
.link input{width:100%;min-height:40px;border:1px solid var(--fb);border-radius:8px;padding:8px 10px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:transform .18s;z-index:9}
.toast{visibility:hidden}.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast button{background:none;border:0;color:#9fe3d7;font-weight:700;margin-left:10px;cursor:pointer}
@media(max-width:760px){.sheet{margin:0;border:0;padding:14px}.mast h1{font-size:30px}.strap{grid-template-columns:repeat(2,1fr)!important}.tool input{width:100%}}
@media print{.more{display:none!important}body{background:#fff}.sheet{border:0;margin:0;padding:0;max-width:none}.tool,.acts,.nb,.toast,.noprint{display:none!important}
  .cols{columns:2}.body{display:block}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="sheet">
  <div class="mast"><h1>Follow-up Bulletin</h1></div>
  <div class="dateline"><span id="dl-date"></span><span id="dl-sum"></span></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const K={t:'fu.tasks',q:'fu.queue',c:'fu.cfg'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=load(K.c,{}),syncing=false,tries=0,retryT;
if(location.hash.length>3){const p=new URLSearchParams(location.hash.slice(1));if(p.get('u')&&p.get('k')){cfg={u:p.get('u'),k:p.get('k')};store(K.c,cfg)}history.replaceState(null,'',location.pathname)}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date((s||today())+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const when=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt,undoFn;const toast=(m,u)=>{const t=$('#toast');undoFn=u;t.innerHTML=esc(m)+(u?'<button id="undo">Undo</button>':'');t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('show');undoFn=null},u?5000:2200)};
$('#toast').onclick=e=>{if(e.target.id==='undo'&&undoFn){const f=undoFn;undoFn=null;f();$('#toast').classList.remove('show')}};

const STD=['SBPDCL','NBPDCL','Energy','BSRDCL','RCD'];
let office='',query='',openIds=new Set(),noteId=null;

$('#dl-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function shell(){
  if(!cfg.u){$('#app').innerHTML=`<div class="link"><h2 class="serif" style="border:0;justify-content:center">Link this computer</h2>
    <p>Paste your setup link (the one ending in <b>&amp;k=…</b>) once. It is remembered in this browser.</p>
    <input id="lk" placeholder="https://…github.io/MDFolloup/#u=…&k=…"><button class="tb" id="lkb">Link</button></div>`;
    $('#lkb').onclick=()=>{const v=$('#lk').value.trim(),h=v.indexOf('#u=');if(h<0){$('#lk').style.borderColor='#b3261e';return}
      const p=new URLSearchParams(v.slice(h+1));cfg={u:p.get('u'),k:p.get('k')};store(K.c,cfg);shell();pull()};return}
  $('#app').innerHTML=`<div class="strap" id="strap"></div>
  <div class="tool noprint">
    <select id="fo"><option value="">All offices</option>${STD.map(o=>`<option value="${o}">${o==='Energy'?'Energy Dept':o}</option>`).join('')}<option value="Other">Other offices</option></select>
    <input type="search" id="q" placeholder="Search tasks, names…">
    <span class="sp"></span><span class="sync" id="sync"></span>
    <button class="tb" id="rf">Refresh</button><button class="tb" id="pr">Print</button><a class="tb" href="index.html">+ Add task</a>
  </div><div id="secs"></div>`;
  $('#fo').onchange=e=>{office=e.target.value;render()};
  $('#q').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
  $('#rf').onclick=()=>{tries=0;sync();pull(true)};$('#pr').onclick=()=>window.print();
  $('#secs').addEventListener('click',onClick);
  $('#secs').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.note){e.preventDefault();saveNote(e.target.dataset.note,e.target.value)}if(e.key==='Escape'){noteId=null;render()}});
  render();
}


// WhatsApp note: task text + "Ref: <who it came from>" + blank line + your note
function waText(t){const f=(t.from||'').trim();const ref=f.includes(' – ')?f.split(' – ').slice(1).join(' – ').trim():f;
  const note=(t.remarks||'').trim();   // your note / instructions, after one blank line
  return t.text.trim()+(ref&&ref!=='Self'?'\nRef: '+ref:'')+(note?'\n\n'+note:'')}
function waLink(t){const m=(t.name||'').replace(/[\s-]/g,'').match(/(?:\+?91)?([6-9]\d{9})(?!\d)/);
  return 'https://wa.me/'+(m?'91'+m[1]:'')+'?text='+encodeURIComponent(waText(t))}
const WA_ICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2.1.7 2.8.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
function story(t,done){const n=diff(t.due),lines=t.text.trim().split('\n');let head=lines[0],rest=lines.slice(1).join('\n').trim();
  const long=head.length>140||rest.split('\n').length>4||rest.length>320;
  if(head.length>140){rest=(head.slice(110)+'\n'+rest).trim();head=head.slice(0,110).replace(/\s+\S*$/,'')+'…'}
  const kick=[t.urgent&&!done?'<span class="urg">Urgent</span>':'',
    done?`<span style="color:var(--ok)">Disposed ${t.doneOn?esc(fmt(t.doneOn)):''}</span>`:n<0?`<span class="late">${-n} day${n===-1?'':'s'} overdue</span>`:n===0?'<span class="tdy">Due today</span>':`<span>Due ${esc(fmt(t.due))}</span>`,
    t.org?`<span>${esc(t.org==='Energy'?'Energy Dept':t.org)}</span>`:''].join('');
  const meta=[t.from&&'From '+esc(t.from),t.source&&'by '+esc(t.source),t.name&&esc(t.name),'added '+esc(when(t.created))].filter(Boolean).join(' · ');
  const acts=done?`<button class="ab" data-a="re">Restore</button>`
    :`<button class="ab dsp" data-a="dsp">✓ Dispose</button><button class="ab" data-a="note">${t.remarks?'Edit note':'Add note'}</button><button class="ab" data-a="d1">+1 day</button><button class="ab" data-a="d7">+1 week</button><button class="ab" data-a="cp">Copy</button><a class="ab wa" href="${esc(waLink(t))}" target="_blank" rel="noopener">${WA_ICON}WhatsApp</a>`;
  const nb=noteId===t.id?`<div class="nb"><input data-note="${esc(t.id)}" value="${esc(t.remarks)}" placeholder="Note, e.g. report received / reply sent"><button class="ab dsp" data-a="ns">Save</button><button class="ab" data-a="nx">Cancel</button></div>`:'';
  return `<article class="story${done?' done':''}${openIds.has(t.id)?' open':''}" data-id="${esc(t.id)}">
    <div class="kick">${kick}</div><h3>${esc(head)}</h3>${rest?`<div class="body">${esc(rest)}</div>`:''}
    ${long?'<div class="more">Show full text ▾</div>':''}<div class="full"><b>${esc(lines[0])}</b>${lines.length>1?'\n'+esc(lines.slice(1).join('\n').trim()):''}</div>
    <div class="meta">${meta}</div>${t.remarks?`<div class="rem">${esc(t.remarks)}</div>`:''}${nb}<div class="acts">${acts}</div></article>`}

function render(){if(!$('#secs'))return;const td=today(),all=load(K.t,[]);
  let ts=all;if(office)ts=ts.filter(t=>office==='Other'?t.org&&!STD.includes(t.org):t.org===office);
  if(query)ts=ts.filter(t=>[t.text,t.org,t.from,t.name,t.source,t.remarks].join(' ').toLowerCase().includes(query));
  const open=ts.filter(t=>t.status!=='Done'),wk=addDays(td,7);
  const by=(a,b)=>a.due.localeCompare(b.due)||(b.urgent?1:0)-(a.urgent?1:0)||(a.created||'').localeCompare(b.created||'');
  const S=[['od','Overdue',open.filter(t=>t.due<td).sort(by)],['td','Due today',open.filter(t=>t.due===td).sort(by)],
    ['wk','This week',open.filter(t=>t.due>td&&t.due<=wk).sort(by)],['lt','Later',open.filter(t=>t.due>wk).sort(by)]];
  const shown=S.filter(x=>x[2].length);   // only sections that have items
  $('#strap').style.gridTemplateColumns=`repeat(${Math.max(shown.length,1)},1fr)`;
  $('#strap').style.display=shown.length?'':'none';
  $('#strap').innerHTML=shown.map(([k,n,a])=>`<a href="#s-${k}" class="${k}"><b>${a.length}</b><span>${n}</span></a>`).join('');
  $('#dl-sum').textContent=[[open.length,'open'],[S[0][2].length,'overdue'],[S[1][2].length,'due today']].filter(x=>x[0]).map(x=>x.join(' ')).join(' · ');
  $('#secs').innerHTML=shown.length?shown.map(([k,n,a])=>
    `<section id="s-${k}"><h2 class="${k}"><span>${n}</span><small>${a.length}</small></h2>
     <div class="cols">${a.map(t=>story(t,false)).join('')}</div></section>`).join('')
    :`<div class="empty" style="text-align:center;padding:30px">${query||office?'No follow-ups match this search.':'No pending follow-ups.'}</div>`;
  badge();
  if(noteId){const i=document.querySelector(`[data-note="${CSS.escape(noteId)}"]`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}

function change(id,f,msg,undo,delay){const ts=load(K.t,[]),t=ts.find(x=>x.id===id);if(!t)return;
  f.updated=new Date().toISOString();Object.assign(t,f);store(K.t,ts);
  const q=load(K.q,[]);q.push({op:'upd',id,f:{...f}});store(K.q,q);
  if(msg)toast(msg,undo);delay?setTimeout(render,delay):render();sync()}
function saveNote(id,v){noteId=null;const t=load(K.t,[]).find(x=>x.id===id);if(t&&(t.remarks||'')!==v.trim())change(id,{remarks:v.trim()},'Note saved');else render()}

function onClick(e){const s=e.target.closest('.story');if(!s)return;const id=s.dataset.id,b=e.target.closest('[data-a]');
  if(!b){if(e.target.closest('.nb,.acts')||getSelection().toString())return;openIds.has(id)?openIds.delete(id):openIds.add(id);s.classList.toggle('open');return}
  const t=load(K.t,[]).find(x=>x.id===id);if(!t)return;const a=b.dataset.a;
  if(a==='cp'){navigator.clipboard?.writeText(waText(t)).then(()=>toast('Copied for WhatsApp'));return}
  if(a==='note'){noteId=id;render();return}
  if(a==='nx'){noteId=null;render();return}
  if(a==='ns'){saveNote(id,s.querySelector('[data-note]').value);return}
  const prev={status:t.status,doneOn:t.doneOn,due:t.due};const undo=()=>change(id,{...prev},'Restored');
  if(a==='dsp'){s.classList.add('gone','done');change(id,{status:'Done',doneOn:today()},'Disposed',undo,380)}
  if(a==='re'){const f={status:'Open',doneOn:''};if(t.due<today())f.due=today();change(id,f,'Restored')}
  if(a==='d1'||a==='d7'){const base=t.due>today()?t.due:today();const d=addDays(base,a==='d1'?1:7);change(id,{due:d},'Moved to '+fmt(d),undo)}
}

function badge(){const s=$('#sync');if(!s)return;const q=load(K.q,[]).length;s.className='sync'+(q?' wait':'');s.textContent=q?q+' waiting to save':'✓ Up to date'}
async function sync(){badge();const q=load(K.q,[]);if(!cfg.u||syncing||!q.length)return;syncing=true;const batch=q.slice(0,50);
  try{const r=await fetch(cfg.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:cfg.k,ops:batch})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'server');
    const q2=load(K.q,[]);q2.splice(0,batch.length);store(K.q,q2);tries=0;syncing=false;badge();if(q2.length)sync();
  }catch(e){syncing=false;badge();if(e.message==='key'){toast('The key is not right. Please link again.');return}
    clearTimeout(retryT);retryT=setTimeout(sync,[4e3,15e3,60e3][Math.min(tries++,2)])}}
async function pull(say){if(!cfg.u)return;const t0=Date.now()-5000;
  try{const r=await fetch(cfg.u+'?a=list&k='+encodeURIComponent(cfg.k));const j=await r.json();if(!j.ok){if(j.error==='key')toast('The key is not right. Please link again.');return}
    const local=load(K.t,[]),q=load(K.q,[]),pending=new Set(q.map(o=>o.id||o.t.id)),byId=new Map(j.tasks.map(t=>[t.id,t]));
    local.forEach(t=>{if(pending.has(t.id)||Date.parse(t.updated)>=t0)byId.set(t.id,t)});
    local.forEach(t=>{if(!byId.has(t.id)&&t.status==='Done')byId.set(t.id,t)});
    store(K.t,[...byId.values()].sort((a,b)=>(b.created||'').localeCompare(a.created||'')));
    if(!noteId)render();if(say)toast('Updated');
  }catch(e){if(say)toast('Could not reach the server. Showing saved copy.')}}

window.addEventListener('storage',e=>{if(e.key===K.t&&!noteId)render();if(e.key===K.q)badge()});
window.addEventListener('focus',()=>{sync();pull()});
setInterval(()=>{if(!document.hidden){sync();pull()}},120000);
setInterval(()=>{if(!noteId)render()},600000);   // keeps "overdue / due today" right after midnight
shell();sync();pull();
})();
</script>
</body>
</html>
