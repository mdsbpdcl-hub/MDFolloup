<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pending Issues Bulletin</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1f2933;--mu:#5d6876;--fa:#8b95a3;--ln:#e3e8ee;--fb:#d3dae3;--pg:#f7f9fb;--ac:#0f8a7e;--ac2:#0b6f66;--act:#e7f5f2;--acl:#cfe9e3;--er:#b3261e;--ert:#fdeeed;--wa:#8a5a00;--wat:#fff7e3;--ok:#1a7f45;--okt:#e9f7ef;--en:#2f6fde;--ot:#0f8a7e}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:14px/1.5 "Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select{font:inherit;color:inherit}
.sheet{max-width:1280px;margin:18px auto;background:#fff;border:1px solid var(--ln);padding:22px 32px 30px}
.mast{text-align:center;padding-bottom:8px;border-bottom:3px double var(--ink)}
.mast h1{font:700 40px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.5px}
.dateline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding:6px 0;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.strap{display:grid;border-bottom:1px solid var(--ink);margin-bottom:6px}
.strap a{display:block;text-align:center;padding:10px 6px;text-decoration:none;color:inherit;border-right:1px solid var(--ln);cursor:pointer}
.strap a:last-child{border-right:0}.strap a:hover{background:var(--pg)}
.strap b{display:block;font:700 30px/1.1 Georgia,serif}
.strap span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.strap .hi b{color:var(--er)}.strap .cl b{color:var(--wa)}.strap .energy b{color:var(--en)}.strap .other b{color:var(--ot)}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 4px}
.tool input,.tool select{min-height:36px;border:1px solid var(--fb);border-radius:8px;padding:6px 10px;background:#fff;outline:0}
.tool input:focus,.tool select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acl)}
.tool input{width:220px}.sp{flex:1}
.tb{min-height:36px;padding:6px 12px;border:1px solid var(--fb);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink)}
.tb:hover{border-color:var(--ac);color:var(--ac2)}.tb:disabled{opacity:.6;cursor:wait}
.state{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--okt);color:var(--ok)}.state.old{background:var(--wat);color:var(--wa)}
section{margin-top:18px}
h2{font:700 22px/1.2 Georgia,serif;margin:0 0 4px;padding-top:8px;border-top:2px solid var(--ink);display:flex;align-items:baseline;gap:10px}
h2 small{font:600 13px "Noto Sans","Segoe UI",sans-serif;color:var(--mu)}
h2.energy{border-top-color:var(--en)}h2.other{border-top-color:var(--ot)}
.subh{font:700 12px "Noto Sans","Segoe UI",sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);margin:12px 0 2px}
.cols{columns:3 300px;column-gap:30px;column-rule:1px solid var(--ln)}
.story{break-inside:avoid;padding:10px 0 12px;border-bottom:1px solid var(--ln)}
.kick{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);display:flex;flex-wrap:wrap;gap:8px}
.kick .hi{color:#fff;background:var(--er);padding:0 6px;border-radius:3px}.kick .cq{color:var(--wa)}
.story h3{font:700 16.5px/1.35 Georgia,serif;margin:4px 0 3px;word-break:break-word}
.story p{margin:0;font-size:14px;color:#33404d;word-break:break-word}
.story .dep{font-size:12px;color:var(--mu);margin-top:4px}
.empty{color:var(--mu);font-style:italic;padding:24px 0;text-align:center}
.link{max-width:600px;margin:30px auto;text-align:center}
.link input{width:100%;min-height:40px;border:1px solid var(--fb);border-radius:8px;padding:8px 10px;margin:10px 0}
.err{background:var(--ert);color:var(--er);border-radius:8px;padding:8px 12px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:transform .18s;z-index:9;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
@media(max-width:760px){.sheet{margin:0;border:0;padding:14px}.mast h1{font-size:28px}.strap{grid-template-columns:repeat(2,1fr)!important}.strap a{border-bottom:1px solid var(--ln)}.tool input{width:100%}.dateline{flex-direction:column;gap:2px}}
@media print{body{background:#fff}.sheet{border:0;margin:0;padding:0;max-width:none}.tool,.toast{display:none!important}.cols{columns:2}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="sheet">
  <div class="mast"><h1 id="mt">Pending Issues Bulletin</h1></div>
  <div class="dateline"><span id="dl-date"></span><span id="dl-sum"></span></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
/* Paste the dashboard web-app link here (ends in /exec) — or open this page once with #src=<link> */
const SOURCE_URL='https://script.google.com/macros/s/AKfycbzLgIDohl8fJWG8Dz8xbzeY4-ivr2usUEJNEGbsOaqJxakjnGOYhLdIQjnIoJNxmmThtg/exec';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let src=SOURCE_URL||ls.get('pid.src','');
if(SOURCE_URL&&ls.get('pid.src','')!==SOURCE_URL){ls.set('pid.src',SOURCE_URL);try{localStorage.removeItem('pid.cache')}catch(e){}}
if(location.hash.includes('src=')){const v=new URLSearchParams(location.hash.slice(1)).get('src');if(v){src=v;ls.set('pid.src',v)}history.replaceState(null,'',location.pathname)}
let DATA=null,fromCache=false,dep='',pri='',query='',lastShown=[],tt;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
const isHigh=it=>String(it.priority||'').toLowerCase()==='high';
const needs=it=>it.needs_clarification===true||it.needs_clarification==='true';
$('#dl-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function jsonUrl(u){u=u.trim();return u+(u.includes('?')?'&':'?')+'format=json'}
async function load(say){
  if(!src)return;
  try{const r=await fetch(jsonUrl(src),{cache:'no-store'});const j=await r.json();if(!j||!Array.isArray(j.groups))throw new Error('bad');
    DATA=j;fromCache=false;ls.set('pid.cache',JSON.stringify(j));render();if(say)toast('Updated');
  }catch(e){const c=ls.get('pid.cache','');if(c&&!DATA){DATA=JSON.parse(c);fromCache=true;render()}
    if(say||!DATA)toast('Could not reach the server.'+(DATA?' Showing the saved copy.':''));if(!DATA)shell()}
}

function shell(){
  if(!src){$('#app').innerHTML=`<div class="link"><h2 style="border:0;justify-content:center">Link the bulletin</h2>
    <p>Paste the Pending Issues dashboard link (ends in <b>/exec</b>). It is remembered in this browser.</p>
    <input id="lk" placeholder="https://script.google.com/macros/s/…/exec"><button class="tb" id="lkb">Link</button></div>`;
    $('#lkb').onclick=()=>{const v=$('#lk').value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){$('#lk').style.borderColor='#b3261e';return}
      src=v.split('#')[0];ls.set('pid.src',src);$('#app').innerHTML='<div class="empty">Loading…</div>';load()};return}
  if(!DATA){$('#app').innerHTML='<div class="empty">Loading…</div>';return}
}

function render(){
  const groups=(DATA.groups||[]).map(g=>({id:String(g.id||''),title:g.title||'',items:(g.items||[]).map(it=>Object.assign({_g:String(g.id||'')},it))}));
  const all=groups.flatMap(g=>g.items);
  $('#mt').textContent=String(DATA.title||'Pending Issues').replace(/\s*(Monitoring|Dashboard)\s*$/i,'')+' Bulletin';
  const hi=all.filter(isHigh).length,cl=all.filter(needs).length;
  $('#dl-sum').textContent=[all.length+' pending',hi?hi+' high priority':'',DATA.updated?'updated '+DATA.updated:''].filter(Boolean).join(' · ')+(fromCache?' · saved copy':'');
  const deps=[...new Set(all.map(i=>i.department).filter(Boolean))].sort();
  if(!$('#secs')){
    $('#app').innerHTML=`<div class="strap" id="strap"></div>
      <div class="tool"><select id="fd"></select><select id="fp"><option value="">Any priority</option><option value="High">High priority</option><option value="Normal">Normal</option></select>
      <input type="search" id="q" placeholder="Search actions…"><span class="sp"></span><span class="state" id="st"></span>
      <button class="tb" id="rf">Refresh</button><button class="tb" id="pr">Export PDF</button></div><div id="secs"></div>`;
    $('#fd').onchange=e=>{dep=e.target.value;render()};$('#fp').onchange=e=>{pri=e.target.value;render()};
    $('#q').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};
    $('#rf').onclick=()=>load(true);$('#pr').onclick=exportPdf;
    $('#strap').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();const k=a.dataset.k;
      if(k==='hi'){pri=pri==='High'?'':'High';$('#fp').value=pri;render()}else{const el=document.getElementById('s-'+k);if(el)el.scrollIntoView({behavior:'smooth'})}};
  }
  $('#fd').innerHTML='<option value="">All departments</option>'+deps.map(d=>`<option${d===dep?' selected':''}>${esc(d)}</option>`).join('');
  $('#st').className='state'+(fromCache?' old':'');$('#st').textContent=fromCache?'Saved copy':'✓ Up to date';
  const tiles=[[all.length,'Pending','all'],[hi,'High priority','hi']].concat(groups.map(g=>[g.items.length,g.title,g.id]),[[cl,'Need clarification','cl']]).filter(t=>t[0]);
  $('#strap').style.gridTemplateColumns=`repeat(${tiles.length},1fr)`;
  $('#strap').innerHTML=tiles.map(([n,t,k])=>`<a href="#" data-k="${esc(k)}" class="${esc(k)}"><b>${n}</b><span>${esc(t)}</span></a>`).join('');
  // filtered view
  const by=(a,b)=>(isHigh(b)-isHigh(a))||String(a.id).localeCompare(String(b.id),undefined,{numeric:true});
  const ok=it=>(!dep||it.department===dep)&&(!pri||String(it.priority)===pri)&&(!query||[it.id,it.title,it.action,it.category,it.department].join(' ').toLowerCase().includes(query));
  lastShown=groups.map(g=>{const items=g.items.filter(ok).sort(by);const dset=[...new Set(items.map(i=>i.department||''))];
    const parts=dset.length>1?dset.sort((a,b)=>items.filter(i=>i.department===b).length-items.filter(i=>i.department===a).length||a.localeCompare(b)).map(d=>[d,items.filter(i=>(i.department||'')===d)]):[['',items]];
    return {id:g.id,title:g.title,items,parts}}).filter(g=>g.items.length);
  $('#secs').innerHTML=lastShown.length?lastShown.map(g=>{const h=g.items.filter(isHigh).length;
    return `<section id="s-${esc(g.id)}"><h2 class="${esc(g.id)}"><span>${esc(g.title)}</span><small>${g.items.length}${h?' · '+h+' high priority':''}</small></h2>`+
      g.parts.map(([d,its])=>(d&&g.parts.length>1?`<div class="subh">${esc(d)} · ${its.length}</div>`:'')+`<div class="cols">${its.map(story).join('')}</div>`).join('')+'</section>'}).join('')
    :`<div class="empty">${query||dep||pri?'No actions match these filters.':'No pending actions.'}</div>`;
}
function story(it){
  return `<article class="story"><div class="kick">${isHigh(it)?'<span class="hi">High priority</span>':''}<span>${esc(it.id)}</span>${it.category?`<span>${esc(it.category)}</span>`:''}${needs(it)?'<span class="cq">Needs clarification</span>':''}</div>
    <h3>${esc(it.title||it.action)}</h3>${it.title&&it.action?`<p>${esc(it.action)}</p>`:''}</article>`}

// ---------- Export as PDF: full text, clean page breaks, page numbers ----------
let h2p=null;
function loadH2p(){return h2p||(h2p=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='html2pdf.bundle.min.js';
  sc.onload=()=>res(window.html2pdf);sc.onerror=()=>{h2p=null;rej(new Error('load'))};document.head.appendChild(sc)}))}
function exportDoc(){const n=lastShown.reduce((a,g)=>a+g.items.length,0),hi=lastShown.reduce((a,g)=>a+g.items.filter(isHigh).length,0);
  const dateTxt=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const col={energy:'#2f6fde',other:'#0f8a7e'};
  const item=it=>`<div class="xs" style="border-left:3px solid ${isHigh(it)?'#b3261e':'#d3dae3'};padding:5px 0 5px 10px;margin:0 0 8px">
    <div class="xl" style="font:700 9.5px/1.4 Arial,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#5d6876">${isHigh(it)?'<span style="background:#b3261e;color:#fff;padding:0 4px;border-radius:2px">High priority</span> ':''}${esc(it.id)}${it.category?' · '+esc(it.category):''}${needs(it)?' · <span style="color:#8a5a00">Needs clarification</span>':''}</div>
    <div class="xl" style="font:700 13.5px/1.35 Georgia,'Times New Roman',serif;margin:2px 0;word-break:break-word">${esc(it.title||it.action)}</div>
    ${it.title&&it.action?`<div class="xl" style="font:12px/1.45 Arial,sans-serif;color:#33404d;word-break:break-word">${esc(it.action)}</div>`:''}</div>`;
  const el=document.createElement('div');el.style.cssText='width:100%;background:#fff;color:#1f2933;font-family:Arial,sans-serif';
  el.innerHTML=`<div class="xh" style="text-align:center;border-bottom:3px double #1f2933;padding-bottom:4px"><div style="font:700 28px/1.15 Georgia,'Times New Roman',serif">${esc($('#mt').textContent)}</div></div>
    <div class="xh" style="display:flex;justify-content:space-between;border-bottom:1px solid #1f2933;padding:4px 0;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#5d6876"><span>${esc(dateTxt)}</span><span>${n} pending${hi?' · '+hi+' high priority':''}</span></div>
    ${lastShown.map(g=>{const c=col[g.id]||'#1f2933';const hd=`<div class="xh" style="font:700 17px Georgia,serif;color:${c};border-top:2px solid ${c};padding-top:5px;margin:12px 0 6px">${esc(g.title)} <span style="font:600 11px Arial,sans-serif;color:#5d6876">${g.items.length}</span></div>`;
      let first=true;return g.parts.map(([d,its])=>{const sub=d&&g.parts.length>1?`<div class="xh" style="font:700 10px Arial,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:#5d6876;margin:8px 0 4px">${esc(d)} · ${its.length}</div>`:'';
        const lead=(first?hd:'')+sub;first=false;return `<div class="xs">${lead}${item(its[0]).replace('class="xs"','class=""')}</div>`+its.slice(1).map(item).join('')}).join('')}).join('')||'<p style="text-align:center;color:#5d6876">No pending actions.</p>'}`;
  return el}
function paginate(root,scale,ratio){const W=root.getBoundingClientRect().width,H=Math.floor(Math.floor(W*scale)*ratio)/scale,top0=()=>root.getBoundingClientRect().top;
  [...root.querySelectorAll('.xs,.xh,.xl')].filter(u=>!u.parentElement.closest('.xs')).forEach(u=>{const t0=top0(),r=u.getBoundingClientRect(),y=r.top-t0,b=r.bottom-t0,end=(Math.floor(y/H)+1)*H;
    if(b>end-3&&r.height<H-8){const sp=document.createElement('div');sp.style.height=(end-y+2)+'px';u.parentNode.insertBefore(sp,u)}})}
async function exportPdf(){const b=$('#pr');if(b.disabled)return;b.disabled=true;b.textContent='Preparing PDF…';
  try{const lib=await loadH2p();const today=new Date();const ymd=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    await lib().set({margin:[10,10,14,10],filename:'Pending_Issues_Bulletin_'+ymd+'.pdf',image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,backgroundColor:'#ffffff',logging:false},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:[]}})
      .from(exportDoc()).toContainer().then(function(){paginate(this.prop.container,2,this.prop.pageSize.inner.ratio)})
      .toCanvas().toPdf().get('pdf').then(pdf=>{const n=pdf.internal.getNumberOfPages();const d=today.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
        for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(139,149,163);pdf.text('Pending Issues Bulletin · '+d,10,290);pdf.text('Page '+i+' of '+n,200,290,{align:'right'})}}).save();
    toast('PDF downloaded');
  }catch(e){toast(e&&e.message==='load'?'Could not load the PDF maker. Check the internet and try again.':'Could not make the PDF. Please try again.')}
  finally{b.disabled=false;b.textContent='Export PDF'}}

// start: saved copy first (instant), then the latest
const c=ls.get('pid.cache','');if(src&&c){try{DATA=JSON.parse(c);fromCache=true;render()}catch(e){}}
if(!DATA)shell();
load();
setInterval(()=>{if(!document.hidden)load()},300000);
window.addEventListener('focus',()=>load());
})();
</script>
</body>
</html>
